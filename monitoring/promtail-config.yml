server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_logging']
        target_label: __tmp_should_scrape
        regex: loki
      - source_labels: ['__tmp_should_scrape']
        regex: loki
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Parse JSON logs from structured logging
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            request_id: request_id
            event_type: event_type
            algorithm: algorithm
            duration_seconds: duration_seconds
            error_type: error_type
      # Set timestamp from parsed JSON
      - timestamp:
          source: timestamp
          format: RFC3339
      # Add labels from parsed fields
      - labels:
          level:
          event_type:
          algorithm:
          error_type:
          service:
      # Template for log output
      - template:
          source: output
          template: |
            {{ if .message }}{{ .message }}{{ else }}{{ .Entry }}{{ end }}
      - output:
          source: output

  # Application-specific logs with enhanced parsing
  - job_name: planqer-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: __tmp_service_name
      - source_labels: ['__tmp_service_name']
        regex: backend
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Parse structured JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            event_type: event_type
            algorithm: algorithm
            duration_seconds: duration_seconds
            parts_count: parts_count
            boards_count: boards_count
            boards_used: boards_used
            waste_amount: waste_amount
            error_type: error_type
            error_message: error_message
            client_ip: client_ip
            method: method
            path: path
      # Set labels for filtering and aggregation
      - labels:
          level:
          event_type:
          algorithm:
          error_type:
          method:
      # Parse optimization metrics for alerting
      - match:
          selector: '{event_type="optimization_result"}'
          stages:
            - labels:
                optimization_status: status
                algorithm:
            - metrics:
                optimization_duration:
                  type: Histogram
                  description: "Optimization duration from logs"
                  source: duration_seconds
                  config:
                    buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60]

  # Frontend access logs
  - job_name: planqer-frontend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: __tmp_service_name
      - source_labels: ['__tmp_service_name']
        regex: frontend
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

  # MCP Server logs
  - job_name: planqer-mcp
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: __tmp_service_name
      - source_labels: ['__tmp_service_name']
        regex: mcp-server
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Parse MCP server debug logs
      - regex:
          expression: '^\[MCP Debug\] (?P<mcp_event>.*)'
      - labels:
          mcp_event: