# Prometheus configuration for Planqer Web monitoring
# Add this to your existing Prometheus configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rules for alerting
rule_files:
  - "planqer-alerts.yml"

scrape_configs:
  # Planqer Backend metrics
  - job_name: 'planqer-backend'
    static_configs:
      - targets: ['localhost:8090']  # Backend metrics endpoint
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s

  # Node Exporter for system metrics
  - job_name: 'planqer-node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s

  # cAdvisor for container metrics
  - job_name: 'planqer-cadvisor'
    static_configs:
      - targets: ['localhost:8080']
    scrape_interval: 15s
    metrics_path: /metrics

  # Nginx metrics
  - job_name: 'planqer-nginx'
    static_configs:
      - targets: ['localhost:9113']
    scrape_interval: 15s
    metrics_path: /metrics

  # Docker containers (if using docker-compose labels)
  - job_name: 'planqer-docker'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_docker_container_label_prometheus_port]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: ${1}
      - source_labels: [__meta_docker_container_label_prometheus_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
        regex: /(.+)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service