groups:
  - name: planqer-application
    rules:
      # High error rate alert
      - alert: PlanqerHighErrorRate
        expr: rate(planqer_optimization_requests_total{status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: planqer
          component: backend
        annotations:
          summary: "High optimization error rate detected"
          description: "Planqer optimization error rate is {{ $value }} errors/sec, which is above the threshold of 0.1/sec for algorithm {{ $labels.algorithm }}"
          runbook_url: "https://wiki.example.com/planqer-troubleshooting#high-error-rate"

      # High response time alert
      - alert: PlanqerSlowOptimization
        expr: histogram_quantile(0.95, rate(planqer_optimization_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          service: planqer
          component: backend
        annotations:
          summary: "Slow optimization performance detected"
          description: "95th percentile optimization time is {{ $value }}s for algorithm {{ $labels.algorithm }}, exceeding 30s threshold"

      # Critical response time alert
      - alert: PlanqerCriticalSlowOptimization
        expr: histogram_quantile(0.95, rate(planqer_optimization_duration_seconds_bucket[5m])) > 60
        for: 2m
        labels:
          severity: critical
          service: planqer
          component: backend
        annotations:
          summary: "Critical optimization performance degradation"
          description: "95th percentile optimization time is {{ $value }}s for algorithm {{ $labels.algorithm }}, exceeding critical 60s threshold"

      # High memory usage
      - alert: PlanqerHighMemoryUsage
        expr: (container_memory_usage_bytes{name=~".*planqer.*backend.*"} / container_spec_memory_limit_bytes{name=~".*planqer.*backend.*"}) > 0.85
        for: 3m
        labels:
          severity: warning
          service: planqer
          component: "{{ $labels.name }}"
        annotations:
          summary: "High container memory usage"
          description: "Container {{ $labels.name }} memory usage is {{ $value | humanizePercentage }}, above 85% threshold"

      # High CPU usage
      - alert: PlanqerHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name=~".*planqer.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: planqer
          component: "{{ $labels.name }}"
        annotations:
          summary: "High container CPU usage"
          description: "Container {{ $labels.name }} CPU usage is {{ $value | humanizePercentage }}, above 80% threshold"

      # WebSocket connection threshold
      - alert: PlanqerHighWebSocketConnections
        expr: planqer_websocket_connections_active > 50
        for: 2m
        labels:
          severity: warning
          service: planqer
          component: websocket
        annotations:
          summary: "High number of WebSocket connections"
          description: "Number of active WebSocket connections is {{ $value }}, which may indicate resource pressure"

      # Service availability
      - alert: PlanqerServiceDown
        expr: up{job=~"planqer-.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: planqer
          component: "{{ $labels.job }}"
        annotations:
          summary: "Planqer service is down"
          description: "Planqer service {{ $labels.job }} is down for more than 1 minute"

      # Low cache hit rate
      - alert: PlanqerLowCacheHitRate
        expr: rate(planqer_cache_hits_total[5m]) / (rate(planqer_cache_hits_total[5m]) + rate(planqer_cache_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: info
          service: planqer
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}, below 70% threshold. Consider cache tuning."

      # Disk space (for logs)
      - alert: PlanqerLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          service: planqer
          component: storage
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} available, below 15% threshold"

  - name: planqer-business-metrics
    rules:
      # Optimization success rate
      - alert: PlanqerLowSuccessRate
        expr: rate(planqer_optimization_requests_total{status="success"}[10m]) / rate(planqer_optimization_requests_total[10m]) < 0.95
        for: 5m
        labels:
          severity: warning
          service: planqer
          component: optimization
        annotations:
          summary: "Low optimization success rate"
          description: "Optimization success rate is {{ $value | humanizePercentage }} for algorithm {{ $labels.algorithm }}, below 95% threshold"

      # High waste percentage
      - alert: PlanqerHighWastePercentage
        expr: avg_over_time(planqer_waste_percentage[10m]) > 25
        for: 5m
        labels:
          severity: info
          service: planqer
          component: optimization
        annotations:
          summary: "High material waste detected"
          description: "Average waste percentage is {{ $value }}% for algorithm {{ $labels.algorithm }}, above 25% threshold. Algorithm performance may need review."

      # Unusual request patterns
      - alert: PlanqerUnusualRequestVolume
        expr: rate(planqer_optimization_requests_total[5m]) > (avg_over_time(rate(planqer_optimization_requests_total[5m])[1h:5m]) * 3)
        for: 2m
        labels:
          severity: info
          service: planqer
          component: traffic
        annotations:
          summary: "Unusual request volume spike"
          description: "Current request rate {{ $value }} is 3x higher than hourly average. May indicate unusual usage pattern."

      # Long-running optimizations
      - alert: PlanqerLongRunningOptimization
        expr: planqer_optimization_duration_seconds > 120
        for: 0m
        labels:
          severity: info
          service: planqer
          component: optimization
        annotations:
          summary: "Long-running optimization detected"
          description: "Optimization with algorithm {{ $labels.algorithm }} has been running for {{ $value }}s, exceeding 2 minutes"

  - name: planqer-infrastructure
    rules:
      # Container restart frequency
      - alert: PlanqerFrequentRestarts
        expr: increase(container_start_time_seconds{name=~".*planqer.*"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
          service: planqer
          component: "{{ $labels.name }}"
        annotations:
          summary: "Frequent container restarts"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour"

      # Network connectivity issues
      - alert: PlanqerNetworkErrors
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          service: planqer
          component: nginx
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Nginx is reporting {{ $value }} 5xx errors/sec, indicating backend connectivity issues"

      # Log volume anomaly
      - alert: PlanqerHighLogVolume
        expr: sum(rate({service="backend"}[1m])) > 100
        for: 5m
        labels:
          severity: info
          service: planqer
          component: logging
        annotations:
          summary: "High log volume detected"
          description: "Log volume is {{ $value }} entries/minute, significantly above normal. Check for error loops or verbose logging."