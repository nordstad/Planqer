site_name: Partsible
site_description: Plan the cuts and layouts for boards, sheets, tiles and wallpaper.
site_url: https://docs.partsible.com/
repo_url: https://github.com/nordstad/partsible
repo_name: nordstad/partsible
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/brand/partsible-symbol-flat.svg
  favicon: assets/brand/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nordstad/partsible
    - icon: simple/kofi
      link: https://ko-fi.com/nordstad

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Lite or self-hosted: lite-vs-self-hosted.md
  - Guide:
      - Board cutting: guide/board-cutting.md
      - Sheet cutting: guide/sheet-cutting.md
      - Tile layout: guide/tile-layout.md
      - Wallpaper planning: guide/wallpaper.md
      - 3D model / STEP cutlists: guide/model-cutlist.md
      - Projects & accounts: guide/projects-and-accounts.md
      - Backup and restore: guide/backup-and-restore.md
      - MCP server (AI assistants): guide/mcp-server.md
  - Reference:
      - Configuration: reference/configuration.md
      - REST API: reference/api.md
  - Troubleshooting: troubleshooting.md
  - Privacy: privacy.md
  - Contributing: contributing.md
  - Releasing: releasing.md

not_in_nav: |
  RELEASE_NOTES.md
