# Sweden — boards and building sheets.
#
# Sources (cited per product group; none are retailer sites, nothing here is
# scraped):
#   Lathunden  Svenskt Trä, "Lathunden" 2021, section Virkessortiment
#              (sizes per Swedish standard and Svenskt Trä's product catalogue)
#   TräGuiden  traguiden.se product pages, which list the standard products
#
# Stock lengths: neither source tabulates retail lengths. Lathunden states that
# structural timber longer than 5 400 mm is usually finger-jointed, and that
# glulam is normally stocked up to 12 m. The 1 800, 2 100 and 2 400-5 400 mm
# (300 mm steps) set is the project's working assumption for board stock; it is
# a suggestion that the user can always change, not a statement of availability.
# Prices are never part of the catalogue.
country: SE
name: Sweden
