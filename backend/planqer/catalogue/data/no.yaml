# Norway - boards and building sheets.
#
# Sources (cited per product group; none are retailer sites, nothing is
# scraped):
#   Skogmo Bruk   Norwegian sawmill and pressure-treater, product brochure 2026
#                 (sizes of its justert/dimension-planed and sawn ranges)
#   Moelven       Moelven product pages (timber, glulam, panel, mouldings, sheets)
#   Norgips       Norgips Norge product pages (plasterboard)
#
# Norwegian planed timber is "justert" to 48 x 98 mm and so on, not the Swedish
# 45 x 95 mm, so a model measured at 45 x 95 mm will not match a Norwegian
# framing entry within the 1 mm tolerance and starts unspecified.
#
# Stock lengths are only given where a source states them. Moelven lists fixed
# lengths per size (48 x 98: 2 400 and 3 600-5 400 mm; 48 x 248: 3 000-5 400 mm
# in 300 mm steps), so the 2 400 and 3 000-5 400 mm set is the union, not what
# every size is stocked in. Prices are never part of the catalogue.
