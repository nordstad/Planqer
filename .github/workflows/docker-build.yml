name: Docker build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp-server/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
      - "!backend/**/*.md"
      - "!frontend/**/*.md"
      - "!mcp-server/**/*.md"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp-server/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
      - "!backend/**/*.md"
      - "!frontend/**/*.md"
      - "!mcp-server/**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build all services
        run: docker compose build
