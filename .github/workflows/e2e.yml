name: E2E tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start backend and frontend
        run: docker compose up -d --build backend frontend

      - name: Wait for backend and frontend to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3001/; do sleep 2; done'

      - name: Seed an account
        # A fresh instance has no accounts, so /cutting shows first-run setup
        # rather than "Sign in required" — the e2e suite expects the latter.
        run: |
          curl -sf -X POST http://localhost:8002/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"e2e-seed@example.com","password":"e2e-seed-password"}'

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          # playwright.config.js otherwise starts its own dev server and fails
          # fast if port 3001 is taken — here it's already serving the stack
          # docker compose just brought up.
          SKIP_WEB_SERVER: "1"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
