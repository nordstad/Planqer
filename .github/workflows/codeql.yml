name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Dependabot PRs get a read-only GITHUB_TOKEN regardless of the
    # permissions below — codeql-action's status API call then fails with
    # "Resource not accessible by integration". It re-runs on push to main
    # once a bump merges, so skipping it here just avoids a false-red check.
    # GitHub represents this actor inconsistently ("dependabot[bot]" vs
    # "app/dependabot" depending on the API surface), hence the substring match.
    if: ${{ !contains(github.actor, 'dependabot') }}
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
