name: Static Lite CI

# Checks Lite, and that the self-hosted app stays free of it.
# New and not required to merge yet: see docs/releasing.md.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/partsible/**"
      - "backend/tests/test_build_lite.py"
      - "backend/tests/test_no_lite_code.py"
      - "scripts/**"
      - ".github/workflows/static-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/partsible/**"
      - "backend/tests/test_build_lite.py"
      - "backend/tests/test_no_lite_code.py"
      - "scripts/**"
      - ".github/workflows/static-ci.yml"

jobs:
  self-hosted-is-clean:
    # The image users run must contain none of Lite: no Pyodide runtime, no
    # worker, no Lite screens, nothing that loads analytics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # The Umami id is set on purpose: even if it leaked into this build's
      # environment, the self-hosted app must still contain no analytics.
      - name: Build the self-hosted app
        working-directory: frontend
        env:
          VITE_PARTSIBLE_UMAMI_ID: "325f5fce-eb47-46fb-bad7-da1137224c33"
        run: |
          npm ci
          npm run build

      - name: Check it contains no Lite code
        run: python3 scripts/check-no-lite-code.py frontend/build

  lite:
    # Lite as Cloudflare Pages serves it, in three browser engines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: build/pyodide/runtime
          key: pyodide-${{ hashFiles('frontend/src/runtime/manifest.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Lite and check its size
        run: python3 scripts/build-lite.py --check-budget

      - name: Build self-hosted frontend for shared preference checks
        working-directory: frontend
        run: npm run build

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Lite and shared preference checks in the browsers
        working-directory: frontend
        run: npm run test:lite

      # Builds the app again with an Umami id and checks what it sends, with
      # the tracker stood in for. Chromium only: it is about our rules, not the
      # engine.
      - name: Check what Lite sends to analytics
        working-directory: frontend
        run: npm run test:analytics

      - name: Keep the built Lite
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite
          path: build/lite
          retention-days: 7

  runtime-parity:
    # Pyodide and native Python must give the same answers, in Node and in the
    # browsers. Native is the Python the Docker image uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python and the backend
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --frozen

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: build/pyodide/runtime
          key: pyodide-${{ hashFiles('frontend/src/runtime/manifest.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Compare Pyodide with native Python
        working-directory: frontend
        run: npm run test:parity

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the solver and store in the browsers
        working-directory: frontend
        run: npm run test:runtime-browser
