# Docker Compose monitoring configuration for Planqer
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

version: '3.8'

services:
  # Override backend service with monitoring configuration
  backend:
    environment:
      - LOG_LEVEL=INFO
      - STRUCTURED_LOGGING=true
      - METRICS_ENABLED=true
      - PROMETHEUS_PORT=8090
    ports:
      - "8090:8090"  # Prometheus metrics endpoint
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8090"
      - "prometheus.path=/metrics"
      - "logging=loki"
      # Traefik labels for backend API. Set PLANQER_HOST to the hostname you
      # serve Planqer on; these labels do nothing without a Traefik instance
      # watching this Docker socket.
      - "traefik.enable=true"
      - "traefik.http.routers.planqer-backend.rule=Host(`${PLANQER_HOST:-planqer.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.planqer-backend.entrypoints=web,websecure"
      - "traefik.http.routers.planqer-backend.tls=true"
      - "traefik.http.services.planqer-backend.loadbalancer.server.port=8002"
      # Metrics endpoint for Traefik
      - "traefik.http.routers.planqer-backend-metrics.rule=Host(`${PLANQER_HOST:-planqer.localhost}`) && Path(`/metrics`)"
      - "traefik.http.routers.planqer-backend-metrics.entrypoints=web,websecure"
      - "traefik.http.services.planqer-backend-metrics.loadbalancer.server.port=8090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,prometheus.scrape,prometheus.port,prometheus.path"

  # Override frontend service with monitoring configuration  
  frontend:
    environment:
      - NODE_ENV=production
      - ENABLE_METRICS=true
    labels:
      - "logging=loki"
      # Traefik labels for frontend
      - "traefik.enable=true"
      - "traefik.http.routers.planqer-frontend.rule=Host(`${PLANQER_HOST:-planqer.localhost}`)"
      - "traefik.http.routers.planqer-frontend.entrypoints=web,websecure"
      - "traefik.http.routers.planqer-frontend.tls=true"
      - "traefik.http.services.planqer-frontend.loadbalancer.server.port=3001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"

  # Override MCP server service with monitoring configuration
  mcp-server:
    environment:
      - LOG_LEVEL=INFO
      - STRUCTURED_LOGGING=true
    labels:
      - "logging=loki"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"

  # Prometheus Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: planqer-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9100"
      - "prometheus.path=/metrics"
    networks:
      - planqer-network

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: planqer-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"
    networks:
      - planqer-network

  # Promtail for log aggregation to Loki
  promtail:
    image: grafana/promtail:latest
    container_name: planqer-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - backend
      - frontend
      - mcp-server
    networks:
      - planqer-network

volumes:
  prometheus_data:
  grafana_data: